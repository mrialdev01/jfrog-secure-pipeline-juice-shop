# Kubernetes deployment for the image built by the secure pipeline (build 12).
#
# Option A - offline (recommended for reviewers): load the delivered archive, no registry access needed.
#   docker load < juice-shop-12.tar.gz
#   kind load docker-image trialmrial.jfrog.io/jfjs-docker/jfrog-juice-shop:12      # for a kind cluster
#   kubectl apply -f jfrog-juice-shop.yaml
#   (The missing "jfrog-pull" secret below only produces a harmless warning when the image is already present.)
#
# Option B - pull from the JFrog trial registry with a read-only token (never commit the token):
#   kubectl create secret docker-registry jfrog-pull \
#     --docker-server=trialmrial.jfrog.io --docker-username=<user> --docker-password=<read-only-token>
#   kubectl apply -f jfrog-juice-shop.yaml
#
# Then:  kubectl port-forward svc/jfrog-juice-shop 3000:3000   ->  http://localhost:3000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jfrog-juice-shop
  labels: {app: jfrog-juice-shop}
spec:
  replicas: 1
  selector:
    matchLabels: {app: jfrog-juice-shop}
  template:
    metadata:
      labels: {app: jfrog-juice-shop}
    spec:
      imagePullSecrets:
        - name: jfrog-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: juice-shop
          image: trialmrial.jfrog.io/jfjs-docker/jfrog-juice-shop:12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Juice Shop writes to ./data and ./logs at runtime
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /rest/admin/application-version, port: 3000}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /rest/admin/application-version, port: 3000}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jfrog-juice-shop
spec:
  selector: {app: jfrog-juice-shop}
  ports:
    - port: 3000
      targetPort: 3000
