name: secure-pipeline

on:
  push:
    branches: [main, secure-pipeline]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JF_URL: https://trialmrial.jfrog.io
  JF_HOST: trialmrial.jfrog.io
  NODE_VERSION: "24"
  IMAGE_NAME: jfrog-juice-shop
  BUILD_NAME: jfrog-juice-shop
  BUILD_NUMBER: ${{ github.run_number }}
  JFROG_CLI_BUILD_PROJECT: jfjs
  NPM_VIRTUAL: jfjs-npm
  DOCKER_VIRTUAL: jfjs-docker
  DEV_REPO: jfjs-docker-dev-local
  PROD_REPO: jfjs-docker-prod-local

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Verify JFrog connection and credentials
        env:
          JF_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          jf rt ping
          # ping is anonymous, so also make one authenticated call
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${JF_TOKEN}" \
            "${JF_URL}/artifactory/api/repositories/${NPM_VIRTUAL}")
          echo "Authenticated API check: HTTP ${code}"
          test "${code}" = "200"

      # ---- 1. Compile: dependencies resolved only through Artifactory ----
      # Juice Shop's postinstall runs a nested `npm install` in frontend/.
      # A user-level .npmrc makes every npm call resolve through Artifactory with credentials.
      - name: Configure npm for Artifactory (also covers nested npm calls)
        env:
          JF_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          {
            echo "registry=${JF_URL}/artifactory/api/npm/${NPM_VIRTUAL}/"
            echo "//${JF_HOST}/artifactory/api/npm/${NPM_VIRTUAL}/:_authToken=${JF_TOKEN}"
          } > ~/.npmrc

      - name: Configure npm to resolve from Artifactory
        run: jf npmc --repo-resolve ${{ env.NPM_VIRTUAL }} --repo-deploy ${{ env.NPM_VIRTUAL }}

      - name: Install and compile (npm install runs the project build)
        run: jf npm install --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }}

      # ---- 2. Tests (quality gate #1: any failing test stops the pipeline) ----
      # A few Juice Shop tests call github.com and other external sites, so they can
      # fail on a network hiccup. Retry once; a genuine failure fails both attempts.
      - name: Run tests
        run: npm test || (echo "Tests failed, retrying once (network-dependent tests can be flaky)" && npm test)

      # ---- 3. Package as Docker image, base images via Artifactory ----
      - name: Create .npmrc secret for the Docker build
        run: |
          {
            echo "registry=${JF_URL}/artifactory/api/npm/${NPM_VIRTUAL}/"
            echo "//${JF_HOST}/artifactory/api/npm/${NPM_VIRTUAL}/:_authToken=${{ secrets.JF_ACCESS_TOKEN }}"
          } > "$RUNNER_TEMP/npmrc"

      - name: Log in to Artifactory Docker registry
        run: echo "${{ secrets.JF_ACCESS_TOKEN }}" | docker login "${JF_HOST}" -u "${{ secrets.JF_USER }}" --password-stdin

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${JF_HOST}/${DOCKER_VIRTUAL}/${IMAGE_NAME}:${BUILD_NUMBER}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build \
            --secret id=npmrc,src="$RUNNER_TEMP/npmrc" \
            --build-arg NODE_IMAGE="${JF_HOST}/${DOCKER_VIRTUAL}/library/node:24" \
            --build-arg DISTROLESS_IMAGE="${JF_HOST}/${DOCKER_VIRTUAL}/distroless/nodejs24-debian13" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}" .

      - name: Push image (recorded in build-info)
        run: |
          jf docker push "${IMAGE}" \
            --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER}

      # ---- 4. Traceability: build-info ties code, deps, image and commit together ----
      - name: Collect environment and git info, publish build-info
        run: |
          jf rt build-collect-env ${BUILD_NAME} ${BUILD_NUMBER}
          jf rt build-add-git ${BUILD_NAME} ${BUILD_NUMBER}
          jf rt build-publish ${BUILD_NAME} ${BUILD_NUMBER}

      # ---- 5. Quality gate #2: Xray scan of the build; fails on policy violations ----
      - name: Xray build scan (gate)
        run: jf build-scan ${BUILD_NAME} ${BUILD_NUMBER} --fail=true

      # ---- 6. SBOM (CycloneDX) of the image, exported from Xray ----
      - name: Export CycloneDX SBOM
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          jf xr curl -s -X POST /api/v1/component/exportDetails \
            -H "Content-Type: application/json" \
            -d "{\"package_type\":\"docker\",\"component_name\":\"${IMAGE_NAME}:${BUILD_NUMBER}\",\"path\":\"${DEV_REPO}/${IMAGE_NAME}/${BUILD_NUMBER}/manifest.json\",\"cyclonedx\":true,\"cyclonedx_format\":\"json\"}" \
            --output out/sbom-cyclonedx.zip
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: out/

      # ---- 7. Promote only if every gate above passed (main branch only) ----
      - name: Promote build to prod-local
        if: github.ref == 'refs/heads/main'
        run: |
          jf rt build-promote ${BUILD_NAME} ${BUILD_NUMBER} ${PROD_REPO} \
            --status=PROMOTED --comment="Passed tests and Xray gate" --copy=true
