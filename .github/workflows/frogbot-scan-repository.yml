name: "Frogbot Scan Repository"
on:
  workflow_dispatch:       # run on demand for the demo
permissions:
  pull-requests: write
  contents: write
  security-events: write
  id-token: write          # OIDC: no stored JFrog token
jobs:
  scan-repository:
    runs-on: ubuntu-latest
    name: Scan Repository (${{ matrix.branch }} branch)
    strategy:
      matrix:
        branch: ["main"]
    steps:
      - uses: jfrog/frogbot@v2
        env:
          JF_URL: https://trialmrial.jfrog.io
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: ${{ matrix.branch }}
          JF_PROJECT: jfjs
          JF_SKIP_AUTOFIX: "true"   # scan and report only; do not open fix PRs (the app is left unchanged on purpose)
        with:
          oidc-provider-name: github-oidc
          oidc-audience: jfrog-github
