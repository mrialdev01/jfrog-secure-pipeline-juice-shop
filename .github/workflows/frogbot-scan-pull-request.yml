name: "Frogbot Scan Pull Request"
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  pull-requests: write
  contents: read
  security-events: write
  id-token: write          # OIDC: no stored JFrog token
jobs:
  scan-pull-request:
    runs-on: ubuntu-latest
    # Public repo: pull_request_target runs with this repo's permissions (including OIDC), so the
    # job waits for a required reviewer on the "frogbot" environment before it starts.
    environment: frogbot
    steps:
      - uses: jfrog/frogbot@v2
        env:
          JF_URL: https://trialmrial.jfrog.io
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_PROJECT: jfjs   # scope Xray scans to the JFrog project
        with:
          oidc-provider-name: github-oidc
          oidc-audience: jfrog-github
